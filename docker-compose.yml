services:
  api:
    build: .
    image: exact-overlap-api:latest
    ports:
      # Host side is overridable through API_PORT (container port is 8000).
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s

  # One-shot acceptance service: waits for a healthy API, runs the full pytest
  # suite (including live HTTP acceptance tests against the api service), and
  # exits non-zero on any failure.
  #
  #   docker compose run --rm verify
  verify:
    image: exact-overlap-api:latest
    build: .
    environment:
      EXACT_AREA_BASE_URL: "http://api:8000"
    command: ["pytest", "-q"]
    depends_on:
      api:
        condition: service_healthy
